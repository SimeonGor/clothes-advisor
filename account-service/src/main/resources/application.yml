spring:
  application:
    name: account-service
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/account_db}
    username: ${DB_USER:account}
    password: ${DB_PASSWORD}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/account_db}
    user: ${DB_USER:account}
    password: ${DB_PASSWORD}

server:
  port: ${APP_PORT:8080}
