spring:
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  config:
    import: "file:../config-repository/wardrobe-service/application.yml"
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: false
    validator-url: ""
  paths-to-match: /api/**
  override-with-generic-response: false

AI_VALIDATION_PASSWORD_FILE: src/test/resources/ai-validation-test-password

app:
  file-client:
    password-file: src/test/resources/file-wardrobe-test-password
