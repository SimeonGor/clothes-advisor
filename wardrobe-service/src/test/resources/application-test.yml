spring:
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  config:
    import: "file:../config-repository/wardrobe-service.yml"
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: false
    validator-url: ""
  paths-to-match: /api/**
  override-with-generic-response: false

app:
  s3:
    endpoint: http://127.0.0.1:1
    bucket: test-photos
  iam:
    service-account-key-file: /nonexistent/test-service-account-key.json
