server:
  port: ${APP_PORT:8080}

# The locator logs remote URIs/errors; the refresh listener emits sanitized outcomes.
logging:
  level:
    org.springframework.cloud.config.client.ConfigServicePropertySourceLocator: "OFF"

app:
  openai:
    owner-login: user

spring:
  config:
    import: "classpath:observability.yml"
  application:
    name: wardrobe-service
  cloud:
    stream:
      function:
        autodetect: false
    bus:
      enabled: false
      id: ${spring.application.name}:${CONFIG_BUS_INSTANCE:${HOSTNAME:${random.uuid}}}
      destination: config.refresh.events
      refresh.enabled: false
      env.enabled: false
      shutdown.enabled: false
      ack.enabled: false
  webflux:
    multipart:
      max-disk-usage-per-part: 10000000B
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clothes_advisor}
    username: ${DB_USER:clothes_advisor}
    password: ${DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    config:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      request-connect-timeout: 2000
      request-read-timeout: 5000
