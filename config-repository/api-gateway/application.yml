server:
  port: 8080

spring:
  reactor:
    context-propagation: auto
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - PreserveHostHeader
            - RemoveRequestHeader=X-User-Id
          httpclient:
            connect-timeout: 5000
          routes:
            - id: account-api
              uri: lb://account-service
              predicates:
                - Path=/api/auth/**,/api/stylists,/api/admin/users,/api/admin/users/*,/api/admin/users/*/password,/api/me/stylist-access,/api/me/stylist-access/*,/api/stylist/clients
            - id: notification-api
              uri: lb://notification-service
              predicates:
                - Path=/api/me/notifications,/api/me/notifications/**
            - id: wardrobe-api
              uri: lb://wardrobe-service
              predicates:
                - Path=/api/**
            - id: account-docs
              uri: lb://account-service
              predicates:
                - Path=/v3/api-docs/account
              filters:
                - SetPath=/v3/api-docs
            - id: wardrobe-docs
              uri: lb://wardrobe-service
              predicates:
                - Path=/v3/api-docs/wardrobe
              filters:
                - SetPath=/v3/api-docs
            - id: notification-docs
              uri: lb://notification-service
              predicates:
                - Path=/v3/api-docs/notification
              filters:
                - SetPath=/v3/api-docs
            - id: frontend-ui
              uri: ${FRONTEND_URL:http://localhost:8082}
              predicates:
                - Path=/,/index.html,/app,/app/**

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY_LOCATION:file:/run/secrets/app-jwt-public-key}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    urls:
      - name: Account
        url: /v3/api-docs/account
      - name: Wardrobe
        url: /v3/api-docs/wardrobe
      - name: Notification
        url: /v3/api-docs/notification
    urls-primary-name: Wardrobe
    disable-swagger-default-url: true
    validator-url: ""

eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    timeout:
      connect-timeout: 2000
      connect-request-timeout: 2000
      socket-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    config:
      enabled: false
