spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      httpclient:
        hc5:
          enabled: false
    loadbalancer:
      retry:
        enabled: false
    circuitbreaker:
      resilience4j:
        disable-time-limiter-map:
          RecommendationClientselectOutfitSelectionRequest: true
          AccountClientgetUserlong: true
          AccountClientrequireStylistAccesslonglong: true
          AccountClientrequireAdminAccesslonglong: true

resilience4j:
  circuitbreaker:
    instances:
      RecommendationClientselectOutfitSelectionRequest:
        ignore-exception-predicate: ru.itmo.clothesadvisor.client.recommendation.NoOutfitFailurePredicate
      AccountClientgetUserlong:
        ignore-exception-predicate: ru.itmo.clothesadvisor.client.account.AccountDomainFailurePredicate
      AccountClientrequireStylistAccesslonglong:
        ignore-exception-predicate: ru.itmo.clothesadvisor.client.account.AccountDomainFailurePredicate
      AccountClientrequireAdminAccesslonglong:
        ignore-exception-predicate: ru.itmo.clothesadvisor.client.account.AccountDomainFailurePredicate

springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: false
    validator-url: ""
  paths-to-match: /api/**
  override-with-generic-response: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
    timeout:
      connect-timeout: 2000
      connect-request-timeout: 2000
      socket-timeout: 5000
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/health
