server:
  port: 8080

spring:
  reactor:
    context-propagation: auto
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - PreserveHostHeader
          httpclient:
            connect-timeout: 5000
          routes:
            - id: account-api
              uri: lb://account-service
              predicates:
                - Path=/api/admin/users,/api/admin/users/*,/api/me/stylist-access,/api/me/stylist-access/*,/api/stylist/clients
            - id: wardrobe-api
              uri: lb://wardrobe-service
              predicates:
                - Path=/api/**
            - id: account-docs
              uri: lb://account-service
              predicates:
                - Path=/v3/api-docs/account
              filters:
                - SetPath=/v3/api-docs
            - id: wardrobe-docs
              uri: lb://wardrobe-service
              predicates:
                - Path=/v3/api-docs/wardrobe
              filters:
                - SetPath=/v3/api-docs
            - id: frontend-ui
              uri: ${FRONTEND_URL:http://localhost:8082}
              predicates:
                - Path=/,/index.html,/demo.js,/demo.css

springdoc:
  swagger-ui:
    urls:
      - name: Account
        url: /v3/api-docs/account
      - name: Wardrobe
        url: /v3/api-docs/wardrobe
    urls-primary-name: Wardrobe
    disable-swagger-default-url: true
    validator-url: ""

eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    timeout:
      connect-timeout: 2000
      connect-request-timeout: 2000
      socket-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    config:
      enabled: false
