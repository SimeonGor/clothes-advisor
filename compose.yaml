services:
  frontend:
    build:
      context: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 5s
      timeout: 5s
      retries: 10

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config/
    volumes:
      - type: bind
        source: ./config-repository
        target: /config
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      FRONTEND_URL: http://frontend:8080
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      frontend:
        condition: service_healthy
      app:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-clothes_advisor}
      POSTGRES_USER: ${DB_USER:-clothes_advisor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: wardrobe-service/Dockerfile
      args:
        APP_UID: ${APP_UID:?Set APP_UID to the credential owner UID (id -u)}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-clothes_advisor}
      DB_USER: ${DB_USER:-clothes_advisor}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must be set}
      YANDEX_SERVICE_ACCOUNT_KEY_FILE: /run/secrets/yandex-service-account-key
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    secrets:
      - yandex-service-account-key
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 10

  account-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD:?ACCOUNT_DB_PASSWORD must be set}
    volumes:
      - account-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    environment:
      DB_R2DBC_URL: r2dbc:postgresql://account-postgres:5432/account_db
      DB_URL: jdbc:postgresql://account-postgres:5432/account_db
      DB_USER: account
      DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?ACCOUNT_DB_PASSWORD must be set}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      account-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 10

  recommendation-service:
    build:
      context: .
      dockerfile: recommendation-service/Dockerfile
      args:
        APP_UID: ${APP_UID:?Set APP_UID to the credential owner UID (id -u)}
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CHATGPT_CREDENTIALS_DIR: /run/chatgpt
      CHATGPT_TRUST_STORE: ${CHATGPT_TRUST_STORE:-}
    volumes:
      - type: bind
        source: ${CHATGPT_CREDENTIALS_DIR:?Set CHATGPT_CREDENTIALS_DIR to an existing absolute path}
        target: /run/chatgpt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  account-postgres-data:

secrets:
  yandex-service-account-key:
    file: ${YANDEX_SERVICE_ACCOUNT_KEY_FILE:?Set YANDEX_SERVICE_ACCOUNT_KEY_FILE to an absolute file path outside the repository}
