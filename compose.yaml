services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-clothes_advisor}
      POSTGRES_USER: ${DB_USER:-clothes_advisor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:?Set APP_UID to the credential owner UID (id -u)}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-clothes_advisor}
      DB_USER: ${DB_USER:-clothes_advisor}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 must be set}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must be set}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CHATGPT_CREDENTIALS_DIR: /run/chatgpt
      CHATGPT_TRUST_STORE: ${CHATGPT_TRUST_STORE:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      LOCAL_USER_PASSWORD: ${LOCAL_USER_PASSWORD:-}
      LOCAL_STYLIST_PASSWORD: ${LOCAL_STYLIST_PASSWORD:-}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
    volumes:
      - type: bind
        source: ${CHATGPT_CREDENTIALS_DIR:?Set CHATGPT_CREDENTIALS_DIR to an existing absolute path}
        target: /run/chatgpt
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
