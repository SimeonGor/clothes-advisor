spring:
  application:
    name: notification-service
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USER:notification_service}
    password: ${DB_PASSWORD}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    user: ${DB_USER:notification_service}
    password: ${DB_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      request-connect-timeout: 2000
      request-read-timeout: 5000
